window.__debugLog = [];

window.__showDebugPanel = function() {

window.onerror = function(msg, url, line, col, error) {

};

});

function applyPDFImages(s){
  const cm={
    maryse:"maryse",duncan:"duncan",francesca:"francesca",
    john:"john",ilia:"ilia",kerenski:"kerenski"
  };
  const bm={
    b_cultiste:"cultiste_art",b_migo:"mi_go_cover",b_shoggoth:"shoggoth_art",
    b_innommable:"innommable_art",b_instrument:"azathoth_art",
    b_polype:"polype_art",b_semence:"semence_art",
    b_goule:"innommable_art",b_templier_nyar:"templier_art"
  };
  return{
    ...s,
    characters:s.characters.map(c=>cm[c.id]&&!c.imageUrl?{...c,imageUrl:IMG_DATA[cm[c.id]]}:c),
    bestiaire:s.bestiaire.map(b=>bm[b.id]&&!b.imageUrl?{...b,imageUrl:IMG_DATA[bm[b.id]]}:b)
  };
}

// Extrait depuis l'URL : ?room=XXXX  ou génère un ID aléatoire
function getRoomId(){
  const p=new URLSearchParams(window.location.search);
  let id=p.get("room");
  if(!id){id=Math.random().toString(36).slice(2,8).toUpperCase();
    window.history.replaceState({},"",`?room=${id}`);}
  return id;
}
const ROOM_ID=getRoomId();
const DB_PATH=`rooms/${ROOM_ID}/state`;
const AUDIO_PATH=`rooms/${ROOM_ID}/audio`;

// ─── FIREBASE HELPERS ─────────────────────────────────────────────────────────
let _db=null;
function getDB(){
  if(_db)return _db;
  try{
    const app=firebase.initializeApp(FIREBASE_CONFIG);
    _db=firebase.database(app);
  }catch(e){
    // App déjà initialisée
    _db=firebase.database();
  }
  return _db;
}

function saveState(s){
  // localStorage pour offline
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s));}catch (e2){}
  // Firebase pour sync temps réel
  try{
    const db=getDB();
    const clean=JSON.parse(JSON.stringify(s)); // strip undefined
    firebase.database().ref(DB_PATH).set(clean);
  }catch(e){console.warn("Firebase save error:",e);}
}

function loadState(){
  try{
    const s=localStorage.getItem(STORAGE_KEY);
    if(!s)return null;
    const parsed=JSON.parse(s);
    return applyPDFImages(normalizeState(parsed));
  }catch (e3){return null;}
}


function buildInitialState(){
  const pawns={};
  CHARACTERS_INIT.forEach((c,i)=>{pawns[c.id]={x:12+i*14,y:50};});
  const base={scenarioIdx:0,stepIdx:0,characters:[...CHARACTERS_INIT],activeCharIds:CHARACTERS_INIT.map(c=>c.id),bestiaire:[...BESTIAIRE_INIT],activeEnemies:[],pawns,mapImages:{},activeMapId:null,mapPins:{},diceLog:[],zoomLevel:1,sharedDisplay:null,mjNotes:{},mapDrawings:{}};
  return applyPDFImages(base);
}

// ── Garantit qu'un état chargé (localStorage/Firebase) a toujours une structure valide ──
function normalizeState(s){
  if(!s||typeof s!=="object")return buildInitialState();
  return{
    scenarioIdx:typeof s.scenarioIdx==="number"?s.scenarioIdx:0,
    stepIdx:typeof s.stepIdx==="number"?s.stepIdx:0,
    characters:Array.isArray(s.characters)?s.characters:[...CHARACTERS_INIT],

    activeEnemies:Array.isArray(s.activeEnemies)?s.activeEnemies:[],
    pawns:(s.pawns&&typeof s.pawns==="object")?s.pawns:{},

}

// ─── MAP PANEL ─────────────────────────────────────────────────────────────────
function MapPanel({scenario,step,pawns,onMove,allEntities,mapImageUrl,mapPins,drawings,readOnly=false,zoom=1,ownId=null,onCanvasClick=null,clickMode=null}){
  const bg={s1:"#100d03",s2:"#030a14",s3:"#030d03",s4:"#08030f"}[scenario.id]||"#0a0a0a";
  const ensured={...pawns};
  allEntities.forEach((e,i)=>{
    const k=e.instanceId||e.id;
    if(!ensured[k])ensured[k]={x:60+(i%4)*9,y:28+Math.floor(i/4)*18};
  });

  // ── Pan & zoom façon Google Maps (indépendant du zoom "slider" existant) ──
  const wrapRef=useRef(null);
  const[view,setView]=useState({x:0,y:0,scale:1});
  const gesture=useRef(null); // {type:'pan'|'pinch', ...}

  const clampScale=s=>Math.max(0.5,Math.min(6,s));

  const onWheel=e=>{
    e.preventDefault();
    const rect=wrapRef.current.getBoundingClientRect();
    const cx=e.clientX-rect.left, cy=e.clientY-rect.top;
    setView(v=>{
      const ns=clampScale(v.scale*(1-e.deltaY*0.0015));
      const k=ns/v.scale;
      return{scale:ns, x:cx-(cx-v.x)*k, y:cy-(cy-v.y)*k};
    });
  };

  const onBgPointerDown=e=>{
    if(e.target.closest('[data-pawn]'))return; // ne pas capter le drag des pions
    e.currentTarget.setPointerCapture&&e.currentTarget.setPointerCapture(e.pointerId);
    gesture.current={type:'pan',startX:e.clientX,startY:e.clientY,origX:view.x,origY:view.y,moved:false};
  };
  const onBgPointerMove=e=>{
    if(!gesture.current||gesture.current.type!=='pan')return;
    const g=gesture.current;
    const dx=e.clientX-g.startX, dy=e.clientY-g.startY;
    if(Math.abs(dx)>4||Math.abs(dy)>4)g.moved=true;
    setView(v=>({...v,x:g.origX+dx,y:g.origY+dy}));
  };
  const onBgPointerUp=e=>{
    const g=gesture.current;
    if(g&&g.type==='pan'&&!g.moved&&clickMode&&onCanvasClick){
      // Clic simple (pas un pan) : calculer la position réelle sur l'image en tenant compte du pan/zoom
      const rect=wrapRef.current.getBoundingClientRect();
      const px=e.clientX-rect.left, py=e.clientY-rect.top;
      const realX=(px-view.x)/(view.scale*zoom);
      const realY=(py-view.y)/(view.scale*zoom);
      const xPct=clamp((realX/rect.width)*100,0,100);
      const yPct=clamp((realY/rect.height)*100,0,100);
      onCanvasClick(xPct,yPct);
    }
    gesture.current=null;
  };

  // Pinch tactile (2 doigts)
  const touchStartDist=useRef(0);
  const touchStartScale=useRef(1);
  const touchStartMid=useRef({x:0,y:0});
  const onTouchStartBg=e=>{
    if(e.target.closest('[data-pawn]'))return;
    if(e.touches.length===2){
      const[t1,t2]=e.touches;
      touchStartDist.current=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);
      touchStartScale.current=view.scale;
      const rect=wrapRef.current.getBoundingClientRect();
      touchStartMid.current={x:(t1.clientX+t2.clientX)/2-rect.left,y:(t1.clientY+t2.clientY)/2-rect.top};
      gesture.current={type:'pinch'};
    } else if(e.touches.length===1){
      gesture.current={type:'pan',startX:e.touches[0].clientX,startY:e.touches[0].clientY,origX:view.x,origY:view.y};
    }
  };
  const onTouchMoveBg=e=>{
    if(!gesture.current)return;
    const g=gesture.current;
    if(g.type==='pinch'&&e.touches.length===2){
      e.preventDefault();
      const[t1,t2]=e.touches;
      const dist=Math.hypot(t2.clientX-t1.clientX,t2.clientY-t1.clientY);
      const ns=clampScale(touchStartScale.current*(dist/touchStartDist.current));
      const k=ns/view.scale;
      const{x:mx,y:my}=touchStartMid.current;
      setView(v=>({scale:ns,x:mx-(mx-v.x)*k,y:my-(my-v.y)*k}));
    } else if(g.type==='pan'&&e.touches.length===1){
      const dx=e.touches[0].clientX-g.startX, dy=e.touches[0].clientY-g.startY;
      setView(v=>({...v,x:g.origX+dx,y:g.origY+dy}));
    }
  };
  const onTouchEndBg=()=>{gesture.current=null;};

  const resetView=()=>setView({x:0,y:0,scale:1});

  return(
    React.createElement('div', { ref: wrapRef, style: {position:"relative",width:"100%",height:"100%",background:bg,overflow:"hidden",touchAction:"none",cursor:clickMode?"crosshair":(gesture.current?"grabbing":"grab")},
      onWheel: onWheel,
      onPointerDown: onBgPointerDown, onPointerMove: onBgPointerMove, onPointerUp: onBgPointerUp, onPointerLeave: onBgPointerUp,
      onTouchStart: onTouchStartBg, onTouchMove: onTouchMoveBg, onTouchEnd: onTouchEndBg,
    }
      /* Bouton reset vue */
      , (view.scale!==1||view.x!==0||view.y!==0)&&React.createElement('button',{onClick:resetView,style:{position:"absolute",top:6,right:6,zIndex:30,background:"rgba(0,0,0,0.7)",border:"1px solid #374151",color:"#fff",borderRadius:6,padding:"4px 8px",fontSize:9,cursor:"pointer",fontFamily:"inherit"}},"⟲ Recentrer")
      , React.createElement('div', { style: {position:"absolute",inset:0,
          transform:`translate(${view.x}px, ${view.y}px) scale(${view.scale*zoom})`,
          transformOrigin:"0 0",willChange:"transform"},}
        , mapImageUrl
          ?React.createElement('img', { src: mapImageUrl, alt: "map", draggable:false, style: {position:"absolute",inset:0,width:"100%",height:"100%",objectFit:"contain",background:"#000",pointerEvents:"none"},})
          :React.createElement('svg', { style: {position:"absolute",inset:0,width:"100%",height:"100%",opacity:0.18},}
            , React.createElement('defs', null, React.createElement('pattern', { id: `grid_${scenario.id}`, width: "40", height: "40", patternUnits: "userSpaceOnUse",}
              , React.createElement('path', { d: "M40 0L0 0 0 40"    , fill: "none", stroke: scenario.accentColor, strokeWidth: "0.5",})
            ))
            , React.createElement('rect', { width: "100%", height: "100%", fill: `url(#grid_${scenario.id})`,})
          )
        /* Custom pins */
        , Object.entries(mapPins||{}).map(([pid,pin])=>(
          React.createElement('div', { key: pid, style: {position:"absolute",left:`${pin.x}%`,top:`${pin.y}%`,transform:"translate(-50%,-50%)",pointerEvents:"none",textAlign:"center",zIndex:5},}
            , React.createElement('div', { style: {width:10,height:10,borderRadius:"50%",background:pin.color||"#ef4444",boxShadow:`0 0 8px ${pin.color||"#ef4444"}`,margin:"0 auto 2px"},})
            , React.createElement('div', { style: {background:"rgba(0,0,0,0.88)",color:pin.color||"#ef4444",fontSize:8,padding:"1px 6px",borderRadius:3,whiteSpace:"nowrap",border:`1px solid ${pin.color||"#ef4444"}55`},}, pin.label)
          )
        ))
        /* Drawings (annotations MJ) */
        , Object.entries(drawings||{}).map(([did,d])=>{
          const S=18;
          const shapeEl = d.shape==="cross"
            ? React.createElement('svg',{width:S,height:S,viewBox:"0 0 20 20"},React.createElement('path',{d:"M3 3L17 17M17 3L3 17",stroke:"#ef4444",strokeWidth:2.5,strokeLinecap:"round"}))
            : d.shape==="circle"
            ? React.createElement('svg',{width:S,height:S,viewBox:"0 0 20 20"},React.createElement('circle',{cx:10,cy:10,r:8,fill:"none",stroke:"#f59e0b",strokeWidth:2.5}))
            : d.shape==="square"
            ? React.createElement('svg',{width:S,height:S,viewBox:"0 0 20 20"},React.createElement('rect',{x:3,y:3,width:14,height:14,fill:"none",stroke:"#60a5fa",strokeWidth:2.5}))
            : d.shape==="triangle"
            ? React.createElement('svg',{width:S,height:S,viewBox:"0 0 20 20"},React.createElement('path',{d:"M10 2L18 17H2Z",fill:"none",stroke:"#a78bfa",strokeWidth:2.5}))
            : d.shape==="line"
            ? React.createElement('svg',{width:S,height:S,viewBox:"0 0 20 20"},React.createElement('path',{d:"M3 17L17 3",stroke:"#6ee7b7",strokeWidth:2.5,strokeLinecap:"round"}))
            : null;
          return React.createElement('div',{key:did,style:{position:"absolute",left:`${d.x}%`,top:`${d.y}%`,transform:"translate(-50%,-50%)",pointerEvents:"none",zIndex:6,filter:"drop-shadow(0 0 3px rgba(0,0,0,0.9))"}},shapeEl);
        })
        /* Pawns */
        , allEntities.map(e=>(
          React.createElement(PawnToken, { key: e.instanceId||e.id, entity: e,
            pos: ensured[e.instanceId||e.id]||{x:50,y:50},
            onDragEnd: onMove, readOnly: readOnly||(ownId!==null&&(e.instanceId||e.id)!==ownId),})
        ))
      )
      , step&&React.createElement('div', { style: {position:"absolute",bottom:6,left:6,right:6,
        background:"rgba(0,0,0,0.88)",border:`1px solid ${scenario.accentColor}44`,
        borderRadius:5,padding:"4px 9px",color:scenario.accentColor,fontSize:9.5,pointerEvents:"none",zIndex:20},}
        , React.createElement('b', null, step.label), React.createElement('span', { style: {opacity:0.5,marginLeft:8},}, "⏱ " , step.time)
      )
    )
  );
}

// ─── IMAGE CROP PICKER ─────────────────────────────────────────────────────
// Deux onglets : "avatar" (pion/avatar, cadrage serré) et "fiche" (vue pleine).
// Retourne via onConfirm({ url, avatar:{ox,oy,s}, fiche:{ox,oy,s} })
// NOUVEAU SYSTÈME : image entière affichée, 3 cadres déplaçables/zoomables
function ImageCropPicker({onConfirm,onClose,currentUrl,
  currentAvatarOX=0,currentAvatarOY=0,currentAvatarS=1,
  currentFicheOX=0,currentFicheOY=0,currentFicheS=1}){
  const[url,setUrl]=useState(currentUrl||null);
  const[imgNatW,setImgNatW]=useState(0);
  const[imgNatH,setImgNatH]=useState(0);
  const fileRef=useRef(null);
  const containerRef=useRef(null);

  // Dimensions d'affichage de l'image entière dans la zone
  const DISPLAY_W=340, DISPLAY_H=320;

  // Pour chaque cadre : {x, y, size} en pixels dans l'espace d'affichage
  // x,y = position du coin supérieur gauche du cadre
  const computeDisplayDims=(nw,nh)=>{
    if(!nw||!nh)return{dw:DISPLAY_W,dh:DISPLAY_H,scale:1};
    const scale=Math.min(DISPLAY_W/nw, DISPLAY_H/nh);
    return{dw:Math.round(nw*scale),dh:Math.round(nh*scale),scale};
  };

  const[frames,setFrames]=useState({
    pion: {x:10,y:10,size:80,shape:'square'},
    avatar:{x:10,y:100,size:70,shape:'circle'},
    login:{x:10,y:190,size:90,shape:'square'},
  });
  const[dragging,setDragging]=useState(null); // {frame, startX,startY,origX,origY}
  const[resizing,setResizing]=useState(null); // {frame, startX,startY,origSize}
  const[active,setActive]=useState('pion');

  const loadFile=(f)=>{
    if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      setUrl(ev.target.result);
      const img=new Image();
      img.onload=()=>{
        setImgNatW(img.naturalWidth);
        setImgNatH(img.naturalHeight);
        const{dw,dh}=computeDisplayDims(img.naturalWidth,img.naturalHeight);
        const s=Math.min(dw,dh);
        setFrames({
          pion: {x:Math.round(dw*0.1),y:Math.round(dh*0.05),size:Math.round(s*0.35),shape:'square'},
          avatar:{x:Math.round(dw*0.35),y:Math.round(dh*0.05),size:Math.round(s*0.3),shape:'circle'},
          login:{x:Math.round(dw*0.6),y:Math.round(dh*0.05),size:Math.round(s*0.35),shape:'square'},
        });
      };
      img.src=ev.target.result;
    };
    r.readAsDataURL(f);
  };

  const {dw,dh,scale}=computeDisplayDims(imgNatW,imgNatH);
  const offsetX=Math.round((DISPLAY_W-dw)/2);
  const offsetY=Math.round((DISPLAY_H-dh)/2);

  // Drag frame
  const onFrameMouseDown=(e,fname)=>{
    e.preventDefault();e.stopPropagation();
    setActive(fname);
    setDragging({frame:fname,startX:e.clientX,startY:e.clientY,origX:frames[fname].x,origY:frames[fname].y});
  };
  const onFrameTouchStart=(e,fname)=>{
    e.stopPropagation();

  };
  // Resize handle
  const onResizeMouseDown=(e,fname)=>{
    e.preventDefault();e.stopPropagation();
    setResizing({frame:fname,startX:e.clientX,startY:e.clientY,origSize:frames[fname].size});
  };
  const onResizeTouchStart=(e,fname)=>{
    e.stopPropagation();
    const t=e.touches[0];
    setResizing({frame:fname,startX:t.clientX,startY:t.clientY,origSize:frames[fname].size});
  };

  const handleMove=useCallback((cx,cy)=>{
    if(dragging){
      const dx=cx-dragging.startX, dy=cy-dragging.startY;
      setFrames(f=>{
        const fr=f[dragging.frame];
        const nx=Math.max(0,Math.min(340-fr.size,dragging.origX+dx));
        const ny=Math.max(0,Math.min(320-fr.size,dragging.origY+dy));
        return{...f,[dragging.frame]:{...fr,x:nx,y:ny}};
      });
    }
    if(resizing){
      const delta=Math.max(cx-resizing.startX, cy-resizing.startY);
      const ns=Math.max(30,Math.min(Math.min(dw,dh),resizing.origSize+delta));
      setFrames(f=>({...f,[resizing.frame]:{...f[resizing.frame],size:ns}}));
    }

  const handleEnd=useCallback(()=>{setDragging(null);setResizing(null);},[]);

  useEffect(()=>{
    const mm=(e)=>handleMove(e.clientX,e.clientY);
    const tm=(e)=>{if(e.touches[0])handleMove(e.touches[0].clientX,e.touches[0].clientY);};
    if(dragging||resizing){

    }
    return()=>{window.removeEventListener('mousemove',mm);window.removeEventListener('mouseup',handleEnd);
      window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',handleEnd);};
  },[dragging,resizing,handleMove,handleEnd]);

  // Extraire les données de crop pour onConfirm
  // On encode: ox,oy = offset du cadre en pixels image naturelle, s = scale de l'image dans le cadre
  const getFrameData=(fname)=>{
    const fr=frames[fname];
    // Position en pixels naturels

  };

  const confirm=()=>{

    const p=getFrameData('pion');
    const a=getFrameData('avatar');
    const l=getFrameData('login');
    // On sauvegarde: ox=x du cadre, oy=y du cadre, s=size du cadre (en px display)

  const LABELS={pion:'🗺 Pion',avatar:'🎭 Avatar',login:'🔑 Login'};
  const COLORS={pion:'#f59e0b',avatar:'#10b981',login:'#60a5fa'};

  return(
    React.createElement('div', { style: {position:"fixed",inset:0,background:"rgba(0,0,0,0.95)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:5000,padding:16}, onClick: onClose,}
      , React.createElement('div', { style: {background:CTHULHU_PANEL_BG,borderRadius:16,width:"min(420px,98vw)",border:`1px solid ${CTHULHU_BORDER}`,boxShadow:"0 0 60px rgba(0,0,0,0.8)",maxHeight:"95vh",overflowY:"auto"}, onClick: e=>e.stopPropagation(),}
        /* Header */
        , React.createElement('div', { style: {padding:"12px 16px",borderBottom:`1px solid ${CTHULHU_BORDER}`,display:"flex",alignItems:"center",justifyContent:"space-between"},}
          , React.createElement('div', { style: {color:"#fff",fontWeight:700,fontSize:13},}, "🖼 Cadrer l'illustration" )
          , React.createElement('button', { onClick: onClose, style: {background:"transparent",border:"none",color:CTHULHU_SUBTLE,fontSize:20,cursor:"pointer",lineHeight:1},}, "✕")
        )
        , React.createElement('div', { style: {padding:14,display:"flex",flexDirection:"column",gap:10},}
          /* Upload */
          , React.createElement('div', { onClick: ()=>_optionalChain([fileRef,'access',_=>_.current,'optionalAccess',_=>_.click,'call',_=>_()]),
              style: {border:"2px dashed #374151",borderRadius:8,padding:url?"6px":"18px",cursor:"pointer",textAlign:"center",background:CTHULHU_PANEL},
              onDragOver:e=>{e.preventDefault();e.currentTarget.style.borderColor="#60a5fa";},
              onDragLeave:e=>{e.currentTarget.style.borderColor=CTHULHU_BORDER;},
              onDrop:e=>{e.preventDefault();e.currentTarget.style.borderColor=CTHULHU_BORDER;loadFile(e.dataTransfer.files[0]);},}
            , url?React.createElement('div',{style:{color:"#60a5fa",fontSize:9}}, "📁 Cliquer pour changer")
              :React.createElement('div',null,React.createElement('div',{style:{fontSize:26,marginBottom:4}},"📁"),React.createElement('div',{style:{color:CTHULHU_FAINT,fontSize:10}},"Cliquer ou glisser une image"))
          )
          , React.createElement('input',{ref:fileRef,type:"file",accept:"image/*",style:{display:"none"},onChange:e=>loadFile(_optionalChain([e,'access',_=>_.target,'access',_=>_.files,'optionalAccess',_=>_[0]]))})

          , url&&React.createElement(React.Fragment,null
            /* Légende */
            , React.createElement('div',{style:{color:CTHULHU_FAINT,fontSize:9,textAlign:"center"}},
              "Glisse chaque cadre pour le positionner • Coin bas-droit pour redimensionner")
            /* Cadres colorés légende */

// ── Générateur de son procédural ──────────────────────────────────────────────
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.nodes = [];
    this.masterGain = null;
    this.currentAmbiance = null;
    this.volume = 0.5;
  }

  ensureCtx() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = this.volume;
      this.masterGain.connect(this.ctx.destination);
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
  }

  stop() {
    this.nodes.forEach(n => { try { n.stop ? n.stop() : n.disconnect(); } catch (e9) {} });
    this.nodes = [];
    this.currentAmbiance = null;
  }

  setVolume(v) {
    this.volume = v;
    if (this.masterGain) this.masterGain.gain.setTargetAtTime(v, this.ctx.currentTime, 0.3);
  }

  // ── Utilitaires ──
  makeNoise(type = "brown") {
    const bufSize = this.ctx.sampleRate * 4;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    let lastOut = 0;
    for (let i = 0; i < bufSize; i++) {
      const white = Math.random() * 2 - 1;
      if (type === "brown") { lastOut = (lastOut + 0.02 * white) / 1.02; data[i] = lastOut * 3.5; }
      else if (type === "pink") { lastOut = lastOut * 0.99 + white * 0.01; data[i] = (lastOut + white) * 0.5; }
      else data[i] = white;
    }
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    return src;
  }

  makeDrone(freq, detune = 0, type = "sine") {
    const osc = this.ctx.createOscillator();
    osc.type = type; osc.frequency.value = freq; osc.detune.value = detune;
    return osc;
  }

  makeFilter(type, freq, Q = 1) {
    const f = this.ctx.createBiquadFilter();
    f.type = type; f.frequency.value = freq; f.Q.value = Q;
    return f;
  }

  makeLFO(freq, depth, target, param) {
    const lfo = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    lfo.frequency.value = freq; gain.gain.value = depth;
    lfo.connect(gain); gain.connect(param);
    lfo.start(); this.nodes.push(lfo);
    return lfo;
  }

  conn(...chain) {
    for (let i = 0; i < chain.length - 1; i++) chain[i].connect(chain[i + 1]);
    chain[chain.length - 1].connect(this.masterGain);
  }

  play(id) {
    this.ensureCtx();
    this.stop();
    this.currentAmbiance = id;
    const t = this.ctx.currentTime;

    if (id === "silence") return;

    const recipes = {
      // ── New York foule ──
      city_buzz: () => {
        // Bruit de fond urbain
        const noise = this.makeNoise("pink");
        const filt = this.makeFilter("bandpass", 800, 0.4);
        const gCity = this.ctx.createGain(); gCity.gain.value = 0.15;
        noise.connect(filt); filt.connect(gCity); gCity.connect(this.masterGain);
        noise.start(); this.nodes.push(noise);
        // Klaxons aléatoires
        for (let i = 0; i < 3; i++) {
          const delay = 2 + Math.random() * 6;
          const osc = this.makeDrone(300 + Math.random() * 200, 0, "square");
          const gHorn = this.ctx.createGain();
          gHorn.gain.setValueAtTime(0, t + delay);
          gHorn.gain.linearRampToValueAtTime(0.08, t + delay + 0.05);
          gHorn.gain.linearRampToValueAtTime(0, t + delay + 0.3 + Math.random() * 0.4);
          osc.connect(gHorn); gHorn.connect(this.masterGain);
          osc.start(); osc.stop(t + delay + 1); this.nodes.push(osc);
        }
      },

      // ── Tension dramatique ──
      explosion: () => {
        const drone = this.makeDrone(55, 0, "sawtooth");
        const filt = this.makeFilter("lowpass", 200, 2);
        const gD = this.ctx.createGain(); gD.gain.value = 0.12;
        this.makeLFO(0.15, 30, null, filt.frequency);
        drone.connect(filt); filt.connect(gD); gD.connect(this.masterGain);
        drone.start(); this.nodes.push(drone);
        // Heartbeat
        const beat = this.makeDrone(60, 0, "sine");
        const gB = this.ctx.createGain(); gB.gain.value = 0;
        beat.connect(gB); gB.connect(this.masterGain); beat.start(); this.nodes.push(beat);
        let step = 0;
        const pulse = () => {
          const now = this.ctx.currentTime;
          gB.gain.cancelScheduledValues(now);
          gB.gain.setValueAtTime(0, now);
          gB.gain.linearRampToValueAtTime(0.18, now + 0.04);
          gB.gain.linearRampToValueAtTime(0, now + 0.15);
          if (step % 2 === 1) { gB.gain.linearRampToValueAtTime(0.1, now + 0.24); gB.gain.linearRampToValueAtTime(0, now + 0.35); }
          step++;
          const interval = step > 10 ? 350 : 650;
          const tid = setTimeout(pulse, interval);
          this.nodes.push({ stop: () => clearTimeout(tid) });
        };
        pulse();
      },

      // ── Hôpital ──
      hospital: () => {
        const noise = this.makeNoise("brown");
        const filt = this.makeFilter("lowpass", 300);
        const g = this.ctx.createGain(); g.gain.value = 0.06;
        noise.connect(filt); filt.connect(g); g.connect(this.masterGain); noise.start(); this.nodes.push(noise);
        // Bip lointain
        const bip = this.makeDrone(880, 0, "sine");
        const gBip = this.ctx.createGain(); gBip.gain.value = 0;
        bip.connect(gBip); gBip.connect(this.masterGain); bip.start(); this.nodes.push(bip);
        const doBip = () => {
          const now = this.ctx.currentTime;
          gBip.gain.setValueAtTime(0.04, now); gBip.gain.linearRampToValueAtTime(0, now + 0.08);
          const tid = setTimeout(doBip, 1800 + Math.random() * 800);
          this.nodes.push({ stop: () => clearTimeout(tid) });
        };
        setTimeout(doBip, 1000);
      },

      // ── Mer calme ──
      ocean_calm: () => {
        const noise = this.makeNoise("brown");
        const filt = this.makeFilter("lowpass", 600);
        const g = this.ctx.createGain(); g.gain.value = 0.2;
        // LFO vagues
        const lfo = this.ctx.createOscillator(); lfo.frequency.value = 0.18;
        const lfoG = this.ctx.createGain(); lfoG.gain.value = 0.1;
        lfo.connect(lfoG); lfoG.connect(g.gain); lfo.start(); this.nodes.push(lfo);
        noise.connect(filt); filt.connect(g); g.connect(this.masterGain); noise.start(); this.nodes.push(noise);
        // Grincements bois
        for (let i = 0; i < 2; i++) {
          const cr = this.makeDrone(80 + i * 40, 0, "sawtooth");
          const fCr = this.makeFilter("bandpass", 200 + i * 50, 5);
          const gCr = this.ctx.createGain(); gCr.gain.value = 0.02;
          this.makeLFO(0.05 + i * 0.03, 15, null, fCr.frequency);
          cr.connect(fCr); fCr.connect(gCr); gCr.connect(this.masterGain);
          cr.start(); this.nodes.push(cr);
        }
      },

      // ── Tempête ──
      storm: () => {
        const wind = this.makeNoise("white");
        const fWind = this.makeFilter("bandpass", 400, 0.5);
        const gWind = this.ctx.createGain(); gWind.gain.value = 0.25;
        this.makeLFO(0.3, 150, null, fWind.frequency);
        wind.connect(fWind); fWind.connect(gWind); gWind.connect(this.masterGain);
        wind.start(); this.nodes.push(wind);
        // Rain
        const rain = this.makeNoise("white");
        const fRain = this.makeFilter("highpass", 4000);
        const gRain = this.ctx.createGain(); gRain.gain.value = 0.08;
        rain.connect(fRain); fRain.connect(gRain); gRain.connect(this.masterGain);
        rain.start(); this.nodes.push(rain);
        // Tonnerre distant
        const doThunder = () => {
          const buf = this.ctx.createBuffer(1, this.ctx.sampleRate * 2, this.ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.8));
          const src = this.ctx.createBufferSource(); src.buffer = buf;
          const gT = this.ctx.createGain(); gT.gain.value = 0.35;
          src.connect(gT); gT.connect(this.masterGain); src.start(); this.nodes.push(src);
          const tid = setTimeout(doThunder, 6000 + Math.random() * 10000);
          this.nodes.push({ stop: () => clearTimeout(tid) });
        };
        setTimeout(doThunder, 3000);
      },

      // ── Salle des machines ──

  const[order,setOrder]=useState([]); // [{id, isEnemy, init}]
  const[etatsTarget,setEtatsTarget]=useState(null); // {entity, isEnemy}
  const[inited,setInited]=useState(false);

  const activeChars=gs.characters.filter(c=>gs.activeCharIds.includes(c.id));
  const allFighters=[
    ...activeChars.map(c=>({...c,isEnemy:false,fid:c.id})),
    ...gs.activeEnemies.map(e=>({...e,isEnemy:true,fid:e.instanceId})),
  ];

  // Init order from allFighters when combat starts
  const startCombat=()=>{
    const o=allFighters.map(f=>({fid:f.fid,isEnemy:f.isEnemy,init:f.init||0,rolled:false}));
    setOrder(o);setInited(true);
  };
  const resetCombat=()=>{setOrder([]);setInited(false);};

  const setInit=(fid,val)=>setOrder(o=>o.map(x=>x.fid===fid?{...x,init:parseInt(val)||0,rolled:true}:x));
  const rollInit=(fid,isEnemy)=>{
    const fighter=allFighters.find(f=>f.fid===fid);
    if(!fighter)return;
    const dexMod=_nullishCoalesce(_optionalChain([fighter, 'access', _101 => _101.mods, 'optionalAccess', _102 => _102.DEX]), () => (0));
    const raw=Math.floor(Math.random()*20)+1;
    const total=raw+dexMod;
    setOrder(o=>o.map(x=>x.fid===fid?{...x,init:total,raw,dexMod,rolled:true}:x));
  };
  const rollAllInit=()=>{
    setOrder(o=>o.map(x=>{
      const fighter=allFighters.find(f=>f.fid===x.fid);
      const dexMod=_nullishCoalesce(_optionalChain([fighter, 'optionalAccess', _103 => _103.mods, 'optionalAccess', _104 => _104.DEX]), () => (0));
      const raw=Math.floor(Math.random()*20)+1;
      return{...x,init:raw+dexMod,raw,dexMod,rolled:true};
    }));
  };

  const sorted=[...order].sort((a,b)=>b.init-a.init);

  const getFighter=(fid,isEnemy)=>isEnemy
    ?gs.activeEnemies.find(e=>e.instanceId===fid)
    :gs.characters.find(c=>c.id===fid);

  const deltaPV=(fid,isEnemy,d)=>{
    const f=getFighter(fid,isEnemy);if(!f)return;

  const deltaPC=(fid,isEnemy,d)=>{

  };
  const openEtats=(fid,isEnemy)=>{

    setEtatsTarget({entity:f,isEnemy,fid});

    if(!etatsTarget)return;

              , React.createElement('div', { style: {width:22,height:22,borderRadius:f.imageUrl?"18%":"50%",background:f.imageUrl?"#000":f.color,display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,overflow:"hidden",flexShrink:0},}

              )

              , React.createElement('span', { style: {color:CTHULHU_FAINT,fontSize:8},}, "Init " , f.init||"?")
            )

        )
        , React.createElement('button', { onClick: startCombat, style: {background:scenario.accentColor,border:"none",color:"#000",borderRadius:8,padding:"10px",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"inherit"},}, "⚔️ Lancer le combat"   )
      )
    );
  }

  return(
    React.createElement('div', { style: {display:"flex",flexDirection:"column",height:"100%",gap:8},}

        , React.createElement('div', { style: {display:"flex",gap:4},}
          , React.createElement('button', { onClick: rollAllInit, style: {background:"#fbbf2422",border:"1px solid #fbbf24",color:"#fbbf24",borderRadius:5,padding:"3px 7px",cursor:"pointer",fontSize:9,fontFamily:"inherit"},}, "🎲 Roll all"  )

// ── ErrorBoundary pour capturer les crashs ──
class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  componentDidCatch(e, info) { console.error('React crash:', e, info); }
  render() {
    if (this.state.error) {
      return React.createElement('div', {
        style: {position:'fixed',top:0,left:0,width:'100%',height:'100%',
          background:'#0a0a0a',color:'#ef4444',padding:20,fontFamily:'monospace',

        React.createElement('pre', {style:{marginTop:10,whiteSpace:'pre-wrap',color:'#fca5a5'}},
          this.state.error && this.state.error.toString()
        )
      );
    }
    return this.props.children;
  }
}
